site_name: Seen vs. Followed
site_description: Do robotic foundation models act on text in the scene?
repo_url: https://github.com/I-Spy-Robot/seen-vs-followed
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  font: { text: IBM Plex Sans, code: IBM Plex Mono }
  features: [navigation.tabs, content.code.copy]
extra_css: [stylesheets/extra.css]
markdown_extensions: [admonition, tables, attr_list, md_in_html]
nav:
  - Report: index.md
  - Appendix:
      - "A. Full tables": results.md
      - "B. Prompts and cells": protocol.md
      - "C. Scene and cards": scene.md
      - "D. Reproduce": reproduce.md
  - SPAIS submission: paper.md
  - Roadmap: roadmap.md
