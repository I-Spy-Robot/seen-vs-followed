site_name: Seen vs. Followed
site_description: Do vision-language-action models act on text in the scene?
repo_url: https://github.com/Ztgunderson/seen-vs-followed
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  font: { text: IBM Plex Mono, code: IBM Plex Mono }
  features: [navigation.tabs, content.code.copy]
extra_css: [stylesheets/extra.css]
markdown_extensions: [admonition, tables, attr_list, md_in_html]
nav:
  - Home: index.md
  - Results: results.md
  - Scene: scene.md
  - Protocol: protocol.md
  - SPAIS submission: paper.md
  - Roadmap: roadmap.md
  - Reproduce: reproduce.md
